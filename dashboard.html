<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My listings · iLiNuX Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="marketplace-style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="mkt-header">
    <a class="mkt-brand" href="marketplace.html"><span class="mark">iL</span> iLiNuX Market</a>
    <nav class="mkt-nav">
      <a href="marketplace.html">Browse</a>
      <a href="sell.html">New listing</a>
    </nav>
  </header>

  <main class="mkt-main">
    <div class="mkt-heading">
      <p class="eyebrow-mkt"><span></span> Dashboard</p>
      <h1>My listings</h1>
      <p id="status-line"></p>
    </div>
    <div id="listing-list"></div>
  </main>

  <script src="supabase-config.js"></script>
  <script>
    (async () => {
      const user = await requireLogin('auth.html');
      if (!user) return;

      const profile = await getMyProfile();
      const statusLine = document.getElementById('status-line');
      if (profile?.seller_status === 'pending') {
        statusLine.textContent = 'Your seller account is awaiting approval from iLiNuX.';
      } else if (profile?.seller_status === 'approved') {
        statusLine.textContent = 'You are an approved seller.';
      } else {
        statusLine.textContent = 'Submit your first listing to become a seller.';
      }

      const { data, error } = await supabaseClient
        .from('listings')
        .select('*')
        .eq('seller_id', user.id)
        .order('created_at', { ascending: false });

      const list = document.getElementById('listing-list');
      if (error) {
        list.innerHTML = '<div class="empty-state">Could not load your listings.</div>';
        return;
      }
      if (!data.length) {
        list.innerHTML = '<div class="empty-state">No listings yet.</div>';
        return;
      }

      const badgeClass = { pending: 'badge-pending', approved: 'badge-approved', rejected: 'badge-rejected' };

      list.innerHTML = data.map(item => `
        <div class="listing-row">
          <div class="info">
            <span class="name">${item.title}</span>
            <span class="meta">${formatCedis(item.price)} · ${item.category}</span>
          </div>
          <span class="badge ${badgeClass[item.status] || ''}">${item.status}</span>
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
