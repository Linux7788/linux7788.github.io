<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · iLiNuX Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="marketplace-style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="mkt-header">
    <a class="mkt-brand" href="marketplace.html"><span class="mark">iL</span> iLiNuX Market</a>
    <nav class="mkt-nav">
      <a href="marketplace.html">Browse</a>
    </nav>
  </header>

  <main class="mkt-main">
    <div class="mkt-form">
      <p class="eyebrow-mkt"><span></span> Account</p>
      <h1 id="form-title">Welcome back</h1>
      <p class="sub" id="form-sub">Sign in to buy or sell on iLiNuX Market.</p>

      <div class="form-error" id="error-box"></div>

      <form id="auth-form">
        <div class="field" id="name-field" style="display:none;">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" placeholder="e.g. Kwame Mensah">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="phone">Phone (+233)</label>
          <input type="tel" id="phone" placeholder="+233 24 000 0000" pattern="^\+233[0-9]{9}$" title="Format: +233XXXXXXXXX">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
      </form>

      <p class="form-toggle" id="toggle-line">
        New here? <a href="#" id="toggle-mode">Create an account</a>
      </p>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script>
    let mode = 'login'; // or 'signup'

    const form = document.getElementById('auth-form');
    const errorBox = document.getElementById('error-box');
    const nameField = document.getElementById('name-field');
    const toggleLine = document.getElementById('toggle-line');
    const toggleMode = document.getElementById('toggle-mode');
    const formTitle = document.getElementById('form-title');
    const formSub = document.getElementById('form-sub');
    const submitBtn = document.getElementById('submit-btn');

    // If already logged in, bounce to marketplace
    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = 'marketplace.html';
    })();

    function applyMode() {
      if (mode === 'signup') {
        formTitle.textContent = 'Create your account';
        formSub.textContent = 'Sign up to browse, buy, or start selling.';
        nameField.style.display = 'block';
        submitBtn.textContent = 'Create account';
        toggleLine.innerHTML = 'Already have an account? <a href="#" id="toggle-mode">Sign in</a>';
      } else {
        formTitle.textContent = 'Welcome back';
        formSub.textContent = 'Sign in to buy or sell on iLiNuX Market.';
        nameField.style.display = 'none';
        submitBtn.textContent = 'Sign in';
        toggleLine.innerHTML = 'New here? <a href="#" id="toggle-mode">Create an account</a>';
      }
    }

    // Single delegated listener handles the toggle link even after innerHTML swaps
    document.body.addEventListener('click', (e) => {
      if (e.target && e.target.id === 'toggle-mode') {
        e.preventDefault();
        mode = mode === 'login' ? 'signup' : 'login';
        applyMode();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      submitBtn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim();
      const fullName = document.getElementById('full-name').value.trim();

      try {
        if (mode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName, phone } }
          });
          if (error) throw error;

          // Create profile row
          if (data.user) {
            await supabaseClient.from('profiles').insert({
              id: data.user.id,
              full_name: fullName,
              phone: phone,
              role: 'buyer',
              seller_status: 'none'
            });
          }
          showToast('Account created! Check your email to confirm, then sign in.');
          mode = 'login';
          applyMode();
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = 'marketplace.html';
        }
      } catch (err) {
        errorBox.textContent = err.message || 'Something went wrong. Try again.';
        errorBox.classList.add('show');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
