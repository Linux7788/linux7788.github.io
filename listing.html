<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listing · iLiNuX Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="marketplace-style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="mkt-header">
    <a class="mkt-brand" href="marketplace.html"><span class="mark">iL</span> iLiNuX Market</a>
    <nav class="mkt-nav"><a href="marketplace.html">← Back to browse</a></nav>
  </header>

  <main class="mkt-main">
    <div id="listing-detail" class="mkt-form" style="max-width:520px;">
      <p class="eyebrow-mkt"><span></span> Listing</p>
      <div id="content">Loading…</div>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script>
    const iconMap = { screens: '▣', boards: '⌘', devices: '◈', accessories: '◇', other: '●' };

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const content = document.getElementById('content');

      if (!id) {
        content.innerHTML = '<p>Listing not found.</p>';
        return;
      }

      const { data: item, error } = await supabaseClient
        .from('listings')
        .select('*, profiles(full_name, phone)')
        .eq('id', id)
        .eq('status', 'approved')
        .single();

      if (error || !item) {
        content.innerHTML = '<p>This listing is not available.</p>';
        return;
      }

      const sellerPhone = (item.profiles?.phone || '').replace(/[^0-9]/g, '');
      const whatsappLink = sellerPhone
        ? `https://wa.me/${sellerPhone}?text=${encodeURIComponent('Hi, I saw your listing "' + item.title + '" on iLiNuX Market. Is it still available?')}`
        : null;

      content.innerHTML = `
        <div class="product-thumb" style="border-radius:10px; margin-bottom:16px;">${iconMap[item.category] || '●'}</div>
        <div class="product-cat">${item.category}</div>
        <h1 style="margin:8px 0;">${escapeHtml(item.title)}</h1>
        <div class="product-price" style="font-size:1.3rem; margin-bottom:14px;">${formatCedis(item.price)}</div>
        <p style="color:var(--text-dim); line-height:1.5;">${escapeHtml(item.description)}</p>
        <p class="product-seller" style="margin:14px 0 20px;">Sold by ${escapeHtml(item.profiles?.full_name || 'iLiNuX seller')}</p>
        ${whatsappLink
          ? `<a class="btn-primary" style="display:block; text-align:center;" href="${whatsappLink}" target="_blank" rel="noopener">Message seller on WhatsApp ↗</a>`
          : `<p style="color:var(--text-dim); font-size:0.85rem;">Seller contact not available yet.</p>`}
      `;
    })();
  </script>
</body>
</html>
